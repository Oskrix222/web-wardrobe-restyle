# Free Supabase projects pause after 7 days without traffic. This makes one
# tiny read a day so the database never falls asleep. Uses only the public
# URL + publishable key already in .env — no secrets needed.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false

      - name: Ping Supabase
        run: |
          url=$(grep '^VITE_SUPABASE_URL=' .env | cut -d= -f2- | tr -d '"')
          key=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '"')
          curl --fail --silent --show-error --max-time 30 \
            "$url/rest/v1/blog_posts?select=id&limit=1" \
            -H "apikey: $key" -o /dev/null
          echo "Supabase OK"
